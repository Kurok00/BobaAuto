name: Bump @version

on:
  push:
    paths:
      - 'boba-auto.user.js'

permissions:
  contents: write

jobs:
  bump:
    # chống vòng lặp vô hạn: bot tự push lại file này thì workflow không chạy lần nữa
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        run: |
          # dùng số nguyên 14 chữ số (YYYYMMDDHHMMSS) để so sánh được chắc chắn
          CUR="$(sed -n 's|^// @version *||p' boba-auto.user.js | tr -dc '0-9')"
          NOW="$(date -u +%Y%m%d%H%M%S)"
          if [ -z "$CUR" ]; then CUR=0; fi
          # version PHẢI tăng đơn điệu, nếu đồng hồ bị lùi thì cộng 1
          if [ "$NOW" -le "$CUR" ]; then NEW="$((CUR + 1))"; else NEW="$NOW"; fi
          sed -i -E "s|^// @version +.*|// @version      ${NEW}|" boba-auto.user.js
          echo "CUR=${CUR} -> NEW=${NEW}"
          grep '^// @version' boba-auto.user.js

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: bump @version"
          git push
