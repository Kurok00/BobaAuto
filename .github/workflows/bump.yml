name: Bump @version

on:
  push:
    paths:
      - 'boba-auto.user.js'

permissions:
  contents: write

jobs:
  bump:
    # chống vòng lặp vô hạn: bot tự push lại file này thì workflow không chạy lần nữa
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        run: |
          NEW="$(date -u +%Y.%m.%d.%H%M)"
          sed -i -E "s|^// @version +.*|// @version      ${NEW}|" boba-auto.user.js
          grep '^// @version' boba-auto.user.js

      - name: Commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: bump @version"
          git push
